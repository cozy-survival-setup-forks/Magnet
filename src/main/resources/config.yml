# Magnet. Place a collector and it picks up every item that drops in its chunk. Reload with /magnet reload.
# The texts are in messages.yml, the prices for selling are in prices.yml.

# The block a collector is made of
block: LODESTONE

# The collector item
item:
  name: "<green><bold>Chunk Collector"
  lore:
    - "<gray>Place it to collect every item"
    - "<gray>that drops in this chunk."
    - "<gray>One per chunk. Right click to open."
  glow: true

# Worlds where collectors cannot be placed
disabled-worlds: []

# Items a collector leaves on the ground
blacklist: []

# Collect items that have a name, lore or enchantments
collect-custom-items: true

# Collect items a player threw with Q. Off by default so players can trade and throw items in a collector chunk.
# Turn it on to test with your own drops. Death drops and fishing catches are never collected.
collect-thrown-items: false

# How many different items one collector can hold, and how many items in total (0 = no limit)
max-types: 200
max-items: 0

# Selling needs Vault and an economy plugin.
# Prices come from ShopGUI+ when it is installed, and from prices.yml.
# AUTO asks ShopGUI+ first and prices.yml for what it does not have, SHOPGUIPLUS and FILE use only that one.
price-source: AUTO
# Sell items that have a name, lore or enchantments (their price is the price of the plain item)
sell-custom-items: false
# Seconds between sales for collectors that have autosell turned on
autosell-interval: 30

# The pull animation. A dropped item falls to the ground, lies there for a moment, floats up, circles
# the collector and gets swallowed. It is only a visual, the item is already in the collector when it
# drops (nobody can pick it up from the ground). Set enabled to false to turn it off.
animation:
  enabled: true
  # Seconds an item lies on the ground before it floats up (0 to 30)
  ground-time: 3
  # Most items animated at once, counting the ones lying on the ground. Past this, items go in without it.
  max-flying: 80
  # A soft pickup sound when items are swallowed
  sound: true
