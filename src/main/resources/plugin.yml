name: Magnet
version: '${version}'
main: dev.magnet.MagnetPlugin
api-version: '1.21'
authors: [Groovyy Roy]
description: One collector per chunk that picks up every dropped item
softdepend:
  - Vault
  - ShopGUIPlus

commands:
  magnet:
    description: Give collectors and reload
    aliases: [collector]
    usage: /<command> <give|reload>

permissions:
  magnet.use:
    description: Place and use collectors
    default: true
  magnet.admin:
    description: Give collectors, open anyone's collector, reload
    default: op
